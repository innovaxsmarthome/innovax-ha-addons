name: Innovax Bridge
version: "0.4.0"
slug: innovax_bridge
description: Evinizi ve ofisinizi Innovax paneline güvenle bağlar. Yalnızca dışarı doğru bağlanır; port açmaz.
url: https://innovax.com.tr
arch:
  - amd64
  - aarch64
image: ghcr.io/innovaxsmarthome/innovax-bridge
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Innovax
options:
  pairing_codes: []
  log_level: info
schema:
  pairing_codes:
    - "str?"
  pairing_code: "str?"
  log_level: "list(debug|info|warning|error)"
